<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>WebGIS Terumbu Karang, Lamun, dan Arus</title>

    <!-- Leaflet CSS -->
    <link
        rel="stylesheet"
        href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    />

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
        }

        #map {
            width: 100%;
            height: 100vh;
        }

        .title-box {
            position: absolute;
            top: 15px;
            left: 50px;
            z-index: 1000;
            background: white;
            padding: 12px 18px;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.2);
        }

        .title-box h2 {
            margin: 0;
            font-size: 20px;
        }

        .title-box p {
            margin: 5px 0 0;
            font-size: 13px;
        }

        .legend {
            background: white;
            padding: 10px;
            line-height: 20px;
            border-radius: 5px;
            box-shadow: 0 1px 5px rgba(0,0,0,0.3);
        }

        .legend i {
            width: 18px;
            height: 18px;
            float: left;
            margin-right: 8px;
            opacity: 0.8;
        }
    </style>
</head>

<body>

    <!-- Map -->
    <div id="map"></div>

    <!-- Title -->
    <div class="title-box">
        <h2>WebGIS Terumbu Karang, Lamun, dan Arus</h2>
        <p>Spatial-Temporal Marine Ecosystem Visualization</p>
    </div>

    <!-- Leaflet JS -->
    <script
        src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js">
    </script>

    <script>

        // ==========================================
        // 1. INITIALIZE MAP
        // ==========================================

        const map = L.map('map').setView([-5.5, 119.5], 6);


        // ==========================================
        // 2. BASEMAP
        // ==========================================

        const osm = L.tileLayer(
            'https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',
            {
                attribution: '&copy; OpenStreetMap contributors'
            }
        ).addTo(map);


        const satellite = L.tileLayer(
            'https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',
            {
                attribution: 'Tiles &copy; Esri'
            }
        );


        // ==========================================
        // 3. LAYER GROUP
        // ==========================================

        const coralLayer = L.layerGroup();

        const seagrassLayer = L.layerGroup();

        const currentLayer = L.layerGroup();


        // ==========================================
        // 4. EXAMPLE CORAL REEF DATA
        // ==========================================

        const coralData = {
            "type": "FeatureCollection",
            "features": [
                {
                    "type": "Feature",
                    "properties": {
                        "Name": "Coral Reef Example",
                        "Year": 2024,
                        "Area_km2": 10.5,
                        "Type": "Coral Reef"
                    },
                    "geometry": {
                        "type": "Point",
                        "coordinates": [119.5, -5.5]
                    }
                }
            ]
        };


        // ==========================================
        // 5. DISPLAY CORAL REEF
        // ==========================================

        L.geoJSON(coralData, {

            pointToLayer: function(feature, latlng) {

                return L.circleMarker(latlng, {
                    radius: 8,
                    fillOpacity: 0.8,
                    weight: 1
                });

            },

            onEachFeature: function(feature, layer) {

                const p = feature.properties;

                layer.bindPopup(`
                    <b>${p.Name}</b><br>
                    Type: ${p.Type}<br>
                    Year: ${p.Year}<br>
                    Area: ${p.Area_km2} km²
                `);

            }

        }).addTo(coralLayer);


        coralLayer.addTo(map);


        // ==========================================
        // 6. LOAD SEAGRASS GEOJSON
        // ==========================================

        fetch('data/seagrass.geojson')

            .then(response => {

                if (!response.ok) {
                    throw new Error('Seagrass GeoJSON not found');
                }

                return response.json();

            })

            .then(data => {

                L.geoJSON(data, {

                    style: function(feature) {

                        return {
                            weight: 1,
                            fillOpacity: 0.6
                        };

                    },

                    onEachFeature: function(feature, layer) {

                        let popup = "<b>Seagrass</b><br>";

                        for (let key in feature.properties) {

                            popup +=
                                `<b>${key}</b>: ${feature.properties[key]}<br>`;

                        }

                        layer.bindPopup(popup);

                    }

                }).addTo(seagrassLayer);

            })

            .catch(error => {

                console.log(
                    "Seagrass data belum tersedia:",
                    error
                );

            });


        // ==========================================
        // 7. LOAD OCEAN CURRENT GEOJSON
        // ==========================================

        fetch('data/ocean_current.geojson')

            .then(response => {

                if (!response.ok) {
                    throw new Error('Ocean current GeoJSON not found');
                }

                return response.json();

            })

            .then(data => {

                L.geoJSON(data, {

                    style: function(feature) {

                        return {
                            weight: 3
                        };

                    },

                    onEachFeature: function(feature, layer) {

                        let popup = "<b>Ocean Current</b><br>";

                        for (let key in feature.properties) {

                            popup +=
                                `<b>${key}</b>: ${feature.properties[key]}<br>`;

                        }

                        layer.bindPopup(popup);

                    }

                }).addTo(currentLayer);

            })

            .catch(error => {

                console.log(
                    "Ocean current data belum tersedia:",
                    error
                );

            });


        // ==========================================
        // 8. LAYER CONTROL
        // ==========================================

        const baseMaps = {

            "OpenStreetMap": osm,

            "Satellite": satellite

        };


        const overlayMaps = {

            "🪸 Terumbu Karang": coralLayer,

            "🌱 Lamun": seagrassLayer,

            "🌊 Arus": currentLayer

        };


        L.control.layers(
            baseMaps,
            overlayMaps,
            {
                collapsed: false
            }
        ).addTo(map);


        // ==========================================
        // 9. SCALE
        // ==========================================

        L.control.scale({
            imperial: false
        }).addTo(map);


        // ==========================================
        // 10. LEGEND
        // ==========================================

        const legend = L.control({
            position: 'bottomright'
        });


        legend.onAdd = function(map) {

            const div = L.DomUtil.create(
                'div',
                'legend'
            );

            div.innerHTML = `
                <b>Legend</b><br>
                <i></i> Terumbu Karang<br>
                <i></i> Lamun<br>
                <i></i> Arus
            `;

            return div;

        };


        legend.addTo(map);

    </script>

</body>
</html>
