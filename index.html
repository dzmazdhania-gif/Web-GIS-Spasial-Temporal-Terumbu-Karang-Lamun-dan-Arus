<!-- LEAFLET + GEOTIFF LIBRARIES -->
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://unpkg.com/georaster"></script>
<script src="https://unpkg.com/georaster-layer-for-leaflet/dist/georaster-layer-for-leaflet.min.js"></script>

<script>

    /* =========================================================
       GEOTIFF FILES
    ========================================================= */

    const rasterData = {
        2021: "./ClippedRajuni2021.tif",
        2024: "./2024new.tif",
        2027: "./2027new.tif",
        2030: "./2030new.tif"
    };


    const sourceData = {
        2021: "Allen Coral Atlas",
        2024: "Allen Coral Atlas",
        2027: "ANN Prediction",
        2030: "ANN Prediction"
    };


    /* =========================================================
       GLOBAL VARIABLES
    ========================================================= */

    let leafletMap = null;
    let currentOverlay = null;
    let currentYear = 2021;
    let currentOpacity = 0.75;

    let osmLayer = null;
    let satelliteLayer = null;

    let mapInitialized = false;
    let loadingYear = null;


    /* =========================================================
       INITIALIZE MAP
    ========================================================= */

    function initMap() {

        if (mapInitialized) {
            return;
        }

        const mapContainer =
            document.getElementById("interactive-map");

        if (!mapContainer) {
            console.error(
                "Element #interactive-map tidak ditemukan."
            );
            return;
        }


        mapInitialized = true;


        /* -----------------------------------------------------
           CREATE LEAFLET MAP
        ----------------------------------------------------- */

        leafletMap = L.map(
            "interactive-map",
            {
                zoomControl: true,
                preferCanvas: true,
                zoomAnimation: false,
                fadeAnimation: false,
                markerZoomAnimation: false,
                inertia: true,
                worldCopyJump: false
            }
        );


        /* -----------------------------------------------------
           OPENSTREETMAP
        ----------------------------------------------------- */

        osmLayer = L.tileLayer(
            "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",
            {
                maxZoom: 19,
                updateWhenIdle: true,
                updateWhenZooming: false,
                keepBuffer: 1,
                attribution:
                    "&copy; OpenStreetMap contributors"
            }
        );


        /* -----------------------------------------------------
           ESRI SATELLITE
        ----------------------------------------------------- */

        satelliteLayer = L.tileLayer(
            "https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}",
            {
                maxZoom: 19,
                updateWhenIdle: true,
                updateWhenZooming: false,
                keepBuffer: 1,
                attribution:
                    "Tiles &copy; Esri"
            }
        );


        /* -----------------------------------------------------
           DEFAULT BASEMAP = OSM
        ----------------------------------------------------- */

        osmLayer.addTo(
            leafletMap
        );


        /* -----------------------------------------------------
           INITIAL MAP VIEW
           Temporary view while GeoTIFF loads
        ----------------------------------------------------- */

        leafletMap.setView(
            [-5.50, 120.50],
            10
        );


        /* -----------------------------------------------------
           LOAD 2021 AUTOMATICALLY
        ----------------------------------------------------- */

        loadYear(2021);


        /* -----------------------------------------------------
           FIX LEAFLET SIZE
        ----------------------------------------------------- */

        setTimeout(
            function() {

                if (leafletMap) {
                    leafletMap.invalidateSize();
                }

            },
            300
        );

    }


    /* =========================================================
       LOAD GEOTIFF
    ========================================================= */

    async function loadYear(year) {

        if (!leafletMap) {
            return;
        }


        /*
           Prevent duplicate loading
        */

        if (loadingYear === year) {
            return;
        }


        loadingYear = year;
        currentYear = year;


        /* -----------------------------------------------------
           SHOW LOADING
        ----------------------------------------------------- */

        const loading =
            document.getElementById("map-loading");

        if (loading) {
            loading.classList.remove("hidden");
        }


        try {

            console.log(
                "======================================"
            );

            console.log(
                "Loading GeoTIFF:",
                rasterData[year]
            );


            /* -------------------------------------------------
               REMOVE PREVIOUS RASTER
            ------------------------------------------------- */

            if (currentOverlay) {

                leafletMap.removeLayer(
                    currentOverlay
                );

                currentOverlay = null;

            }


            /* -------------------------------------------------
               FETCH GEOTIFF
            ------------------------------------------------- */

            const response =
                await fetch(
                    rasterData[year],
                    {
                        cache: "no-cache"
                    }
                );


            if (!response.ok) {

                throw new Error(
                    "HTTP " +
                    response.status +
                    " - " +
                    response.statusText
                );

            }


            /* -------------------------------------------------
               READ ARRAY BUFFER
            ------------------------------------------------- */

            const arrayBuffer =
                await response.arrayBuffer();


            console.log(
                "GeoTIFF size:",
                (
                    arrayBuffer.byteLength /
                    1024 /
                    1024
                ).toFixed(2),
                "MB"
            );


            /* -------------------------------------------------
               PARSE GEORASTER
            ------------------------------------------------- */

            const georaster =
                await parseGeoraster(
                    arrayBuffer
                );


            console.log(
                "GeoRaster:",
                georaster
            );

            console.log(
                "Projection:",
                georaster.projection
            );

            console.log(
                "Width:",
                georaster.width
            );

            console.log(
                "Height:",
                georaster.height
            );

            console.log(
                "Bands:",
                georaster.numberOfRasters
            );

            console.log(
                "NoData:",
                georaster.noDataValue
            );

            console.log(
                "Bounds:",
                georaster.xmin,
                georaster.ymin,
                georaster.xmax,
                georaster.ymax
            );


            /* -------------------------------------------------
               CREATE GEORASTER LAYER
            ------------------------------------------------- */

            const newOverlay =
                new GeoRasterLayer(
                    {
                        georaster: georaster,

                        opacity:
                            currentOpacity,

                        resolution:
                            256,

                        pixelValuesToColorFn:
                            function(values) {

                                return pixelValuesToColor(
                                    values,
                                    georaster
                                );

                            }
                    }
                );


            /* -------------------------------------------------
               ADD RASTER TO MAP
            ------------------------------------------------- */

            newOverlay.addTo(
                leafletMap
            );


            currentOverlay =
                newOverlay;


            /* -------------------------------------------------
               FIT MAP TO RASTER
            ------------------------------------------------- */

            setTimeout(
                function() {

                    if (
                        currentOverlay ===
                        newOverlay
                    ) {

                        const bounds =
                            newOverlay.getBounds();


                        if (
                            bounds &&
                            bounds.isValid()
                        ) {

                            leafletMap.fitBounds(
                                bounds,
                                {
                                    padding:
                                        [20, 20],
                                    maxZoom:
                                        15
                                }
                            );

                        }

                    }

                },
                300
            );


            /* -------------------------------------------------
               UPDATE INFORMATION
            ------------------------------------------------- */

            const yearElement =
                document.getElementById(
                    "map-year"
                );

            if (yearElement) {

                yearElement.textContent =
                    year;

            }


            const sourceElement =
                document.getElementById(
                    "map-source"
                );

            if (sourceElement) {

                sourceElement.textContent =
                    sourceData[year];

            }


            console.log(
                "GeoTIFF successfully displayed:",
                year
            );

            console.log(
                "======================================"
            );

        }


        catch (error) {

            console.error(
                "GeoTIFF ERROR:",
                error
            );


            alert(
                "GeoTIFF " +
                year +
                " gagal dimuat.\n\n" +
                "Cek Console (F12) untuk melihat detail error."
            );

        }


        finally {

            loadingYear = null;


            if (loading) {

                loading.classList.add(
                    "hidden"
                );

            }

        }

    }


    /* =========================================================
       RASTER COLOR FUNCTION
    ========================================================= */

    function pixelValuesToColor(
        values,
        georaster
    ) {

        /*
           No pixel
        */

        if (
            !values ||
            values.length === 0
        ) {

            return null;

        }


        /* -----------------------------------------------------
           CHECK NODATA
        ----------------------------------------------------- */

        const noData =
            georaster.noDataValue;


        /*
           RGB / RGBA RASTER
        */

        if (
            values.length >= 3
        ) {

            const r =
                Number(values[0]);

            const g =
                Number(values[1]);

            const b =
                Number(values[2]);


            /*
               Invalid pixel
            */

            if (
                !Number.isFinite(r) ||
                !Number.isFinite(g) ||
                !Number.isFinite(b)
            ) {

                return null;

            }


            /*
               NoData pixel
            */

            if (
                noData !== null &&
                noData !== undefined &&
                (
                    r === noData ||
                    g === noData ||
                    b === noData
                )
            ) {

                return null;

            }


            /*
               Black background
            */

            if (
                r === 0 &&
                g === 0 &&
                b === 0
            ) {

                return null;

            }


            return (
                "rgba(" +
                r +
                "," +
                g +
                "," +
                b +
                ",1)"
            );

        }


        /* -----------------------------------------------------
           SINGLE BAND RASTER
        ----------------------------------------------------- */

        const value =
            Number(values[0]);


        /*
           Invalid
        */

        if (
            !Number.isFinite(value)
        ) {

            return null;

        }


        /*
           NoData
        */

        if (
            noData !== null &&
            noData !== undefined &&
            value === noData
        ) {

            return null;

        }


        /*
           Background
        */

        if (
            value === 0
        ) {

            return null;

        }


        /*
           Coral reef
        */

        return "rgba(15,118,110,1)";

    }


    /* =========================================================
       YEAR BUTTONS
    ========================================================= */

    document
        .querySelectorAll(".year-btn")
        .forEach(
            function(button) {

                button.addEventListener(
                    "click",
                    function() {

                        const year =
                            Number(
                                this.dataset.year
                            );


                        /*
                           Update active button
                        */

                        document
                            .querySelectorAll(
                                ".year-btn"
                            )
                            .forEach(
                                function(btn) {

                                    btn.classList.remove(
                                        "active"
                                    );

                                }
                            );


                        this.classList.add(
                            "active"
                        );


                        /*
                           Load selected year
                        */

                        if (
                            mapInitialized
                        ) {

                            loadYear(
                                year
                            );

                        }

                    }
                );

            }
        );


    /* =========================================================
       OPACITY SLIDER
    ========================================================= */

    const opacitySlider =
        document.getElementById(
            "opacity-slider"
        );


    if (opacitySlider) {

        opacitySlider.addEventListener(
            "input",
            function() {

                currentOpacity =
                    Number(
                        this.value
                    );


                if (
                    currentOverlay
                ) {

                    currentOverlay.setOpacity(
                        currentOpacity
                    );

                }

            }
        );

    }


    /* =========================================================
       BASEMAP SWITCH
    ========================================================= */

    document
        .querySelectorAll(
            'input[name="basemap"]'
        )
        .forEach(
            function(radio) {

                radio.addEventListener(
                    "change",
                    function() {

                        if (
                            !mapInitialized ||
                            !leafletMap
                        ) {

                            return;

                        }


                        /*
                           OSM
                        */

                        if (
                            this.value === "osm"
                        ) {

                            if (
                                leafletMap.hasLayer(
                                    satelliteLayer
                                )
                            ) {

                                leafletMap.removeLayer(
                                    satelliteLayer
                                );

                            }


                            if (
                                !leafletMap.hasLayer(
                                    osmLayer
                                )
                            ) {

                                osmLayer.addTo(
                                    leafletMap
                                );

                            }

                        }


                        /*
                           Satellite
                        */

                        else if (
                            this.value ===
                            "satellite"
                        ) {

                            if (
                                leafletMap.hasLayer(
                                    osmLayer
                                )
                            ) {

                                leafletMap.removeLayer(
                                    osmLayer
                                );

                            }


                            if (
                                !leafletMap.hasLayer(
                                    satelliteLayer
                                )
                            ) {

                                satelliteLayer.addTo(
                                    leafletMap
                                );

                            }

                        }

                    }
                );

            }
        );


    /* =========================================================
       CORAL REEF TOGGLE
    ========================================================= */

    const coralToggle =
        document.getElementById(
            "coral-toggle"
        );


    if (coralToggle) {

        coralToggle.addEventListener(
            "change",
            function() {

                if (
                    !currentOverlay ||
                    !leafletMap
                ) {

                    return;

                }


                if (
                    this.checked
                ) {

                    currentOverlay.addTo(
                        leafletMap
                    );

                }

                else {

                    leafletMap.removeLayer(
                        currentOverlay
                    );

                }

            }
        );

    }


    /* =========================================================
       SEAGRASS
    ========================================================= */

    const seagrassToggle =
        document.getElementById(
            "seagrass-toggle"
        );


    if (seagrassToggle) {

        seagrassToggle.addEventListener(
            "change",
            function() {

                if (
                    this.checked
                ) {

                    alert(
                        "Seagrass spatial data is not available in the current dataset."
                    );


                    this.checked =
                        false;

                }

            }
        );

    }


    /* =========================================================
       OCEAN CURRENT
    ========================================================= */

    const currentToggle =
        document.getElementById(
            "current-toggle"
        );


    if (currentToggle) {

        currentToggle.addEventListener(
            "change",
            function() {

                if (
                    this.checked
                ) {

                    alert(
                        "Ocean current spatial data is not available in the current dataset."
                    );


                    this.checked =
                        false;

                }

            }
        );

    }


    /* =========================================================
       LAZY LOAD MAP
    ========================================================= */

    const mapSection =
        document.getElementById(
            "webgis"
        );


    if (mapSection) {

        const mapObserver =
            new IntersectionObserver(
                function(entries) {

                    if (
                        entries[0].isIntersecting &&
                        !mapInitialized
                    ) {

                        initMap();

                        mapObserver.disconnect();

                    }

                },
                {
                    rootMargin:
                        "400px 0px"
                }
            );


        mapObserver.observe(
            mapSection
        );

    }


    /* =========================================================
       WINDOW RESIZE
    ========================================================= */

    window.addEventListener(
        "resize",
        function() {

            if (leafletMap) {

                requestAnimationFrame(
                    function() {

                        leafletMap.invalidateSize();

                    }
                );

            }

        }
    );

</script>
