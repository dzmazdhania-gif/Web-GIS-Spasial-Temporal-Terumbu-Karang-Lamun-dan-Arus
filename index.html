<!-- LEAFLET -->
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<!-- GEORASTER -->
<script src="https://unpkg.com/georaster"></script>
<script src="https://unpkg.com/georaster-layer-for-leaflet/dist/georaster-layer-for-leaflet.min.js"></script>

<script>

const rasterData = {
    2021: "./ClippedRajuni2021.tif",
    2024: "./2024new.tif",
    2027: "./2027new.tif",
    2030: "./2030new.tif"
};

const sourceData = {
    2021: "Allen Coral Atlas",
    2024: "Allen Coral Atlas",
    2027: "ANN Prediction",
    2030: "ANN Prediction"
};


let leafletMap = null;
let currentOverlay = null;
let currentYear = 2021;
let currentOpacity = 0.75;

let osmLayer = null;
let satelliteLayer = null;

let mapInitialized = false;


/* =========================================================
   INITIALIZE MAP
========================================================= */

function initMap() {

    if (mapInitialized) return;

    const container = document.getElementById("interactive-map");

    if (!container) {
        console.error("interactive-map tidak ditemukan");
        return;
    }

    mapInitialized = true;

    leafletMap = L.map("interactive-map");

    /* BASEMAP */

    osmLayer = L.tileLayer(
        "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",
        {
            maxZoom: 19,
            attribution: "&copy; OpenStreetMap contributors"
        }
    );

    satelliteLayer = L.tileLayer(
        "https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}",
        {
            maxZoom: 19,
            attribution: "Tiles &copy; Esri"
        }
    );

    osmLayer.addTo(leafletMap);


    /*
       Temporary location
       Will be replaced by GeoTIFF bounds
    */

    leafletMap.setView(
        [-5.50, 120.50],
        10
    );


    /*
       LOAD 2021
    */

    loadYear(2021);


    setTimeout(function() {

        leafletMap.invalidateSize();

    }, 500);
}


/* =========================================================
   LOAD GEOTIFF
========================================================= */

async function loadYear(year) {

    const loading =
        document.getElementById("map-loading");

    if (loading) {
        loading.classList.remove("hidden");
    }


    try {

        console.log("--------------------------------");
        console.log("Loading:", rasterData[year]);


        /*
           REMOVE OLD RASTER
        */

        if (currentOverlay) {

            leafletMap.removeLayer(
                currentOverlay
            );

            currentOverlay = null;
        }


        /*
           FETCH FILE
        */

        const response =
            await fetch(
                rasterData[year]
            );


        console.log(
            "HTTP status:",
            response.status
        );


        if (!response.ok) {

            throw new Error(
                "File tidak ditemukan: " +
                rasterData[year]
            );

        }


        /*
           READ TIFF
        */

        const buffer =
            await response.arrayBuffer();


        console.log(
            "File size:",
            (buffer.byteLength / 1024 / 1024).toFixed(2),
            "MB"
        );


        /*
           PARSE
        */

        const georaster =
            await parseGeoraster(buffer);


        /*
           SHOW INFORMATION
        */

        console.log(
            "========== GEORASTER =========="
        );

        console.log(
            "Projection:",
            georaster.projection
        );

        console.log(
            "Width:",
            georaster.width
        );

        console.log(
            "Height:",
            georaster.height
        );

        console.log(
            "Bands:",
            georaster.numberOfRasters
        );

        console.log(
            "NoData:",
            georaster.noDataValue
        );

        console.log(
            "xmin:",
            georaster.xmin
        );

        console.log(
            "ymin:",
            georaster.ymin
        );

        console.log(
            "xmax:",
            georaster.xmax
        );

        console.log(
            "ymax:",
            georaster.ymax
        );

        console.log(
            "================================"
        );


        /*
           CREATE LAYER
        */

        const layer =
            new GeoRasterLayer({

                georaster: georaster,

                opacity:
                    currentOpacity,

                resolution:
                    128,

                pixelValuesToColorFn:
                    function(values) {

                        if (
                            !values ||
                            values.length === 0
                        ) {
                            return null;
                        }


                        /*
                           RGB TIFF
                        */

                        if (
                            values.length >= 3
                        ) {

                            const r =
                                Number(values[0]);

                            const g =
                                Number(values[1]);

                            const b =
                                Number(values[2]);


                            if (
                                !Number.isFinite(r) ||
                                !Number.isFinite(g) ||
                                !Number.isFinite(b)
                            ) {
                                return null;
                            }


                            /*
                               Transparent black
                            */

                            if (
                                r === 0 &&
                                g === 0 &&
                                b === 0
                            ) {
                                return null;
                            }


                            return `rgb(${r},${g},${b})`;
                        }


                        /*
                           SINGLE BAND
                        */

                        const value =
                            Number(values[0]);


                        if (
                            !Number.isFinite(value)
                        ) {
                            return null;
                        }


                        /*
                           NoData
                        */

                        if (
                            georaster.noDataValue !== null &&
                            georaster.noDataValue !== undefined &&
                            value === georaster.noDataValue
                        ) {
                            return null;
                        }


                        /*
                           Background
                        */

                        if (
                            value === 0
                        ) {
                            return null;
                        }


                        /*
                           Show raster
                        */

                        return "#0f766e";
                    }
            });


        /*
           ADD TO MAP
        */

        layer.addTo(
            leafletMap
        );


        currentOverlay =
            layer;


        /*
           FIT TO GEOTIFF
        */

        setTimeout(function() {

            const bounds =
                layer.getBounds();

            console.log(
                "Leaflet bounds:",
                bounds
            );


            if (
                bounds &&
                bounds.isValid()
            ) {

                leafletMap.fitBounds(
                    bounds,
                    {
                        padding: [20, 20]
                    }
                );

            } else {

                console.error(
                    "GeoTIFF bounds tidak valid."
                );

            }

        }, 500);


        /*
           UPDATE INFO
        */

        const yearElement =
            document.getElementById("map-year");

        if (yearElement) {
            yearElement.textContent = year;
        }


        const sourceElement =
            document.getElementById("map-source");

        if (sourceElement) {
            sourceElement.textContent =
                sourceData[year];
        }

    }


    catch (error) {

        console.error(
            "================================"
        );

        console.error(
            "GEOTIFF ERROR"
        );

        console.error(
            error
        );

        console.error(
            "================================"
        );


        /*
           DON'T BREAK THE WHOLE WEBGIS
        */

        alert(
            "GeoTIFF " +
            year +
            " tidak berhasil dibaca.\n\n" +
            "Cek Console (F12)."
        );

    }


    finally {

        if (loading) {
            loading.classList.add("hidden");
        }

    }
}


/* =========================================================
   YEAR BUTTON
========================================================= */

document
    .querySelectorAll(".year-btn")
    .forEach(function(button) {

        button.addEventListener(
            "click",
            function() {

                const year =
                    Number(
                        this.dataset.year
                    );


                document
                    .querySelectorAll(".year-btn")
                    .forEach(function(btn) {

                        btn.classList.remove(
                            "active"
                        );

                    });


                this.classList.add(
                    "active"
                );


                loadYear(year);

            }
        );

    });


/* =========================================================
   OPACITY
========================================================= */

const opacitySlider =
    document.getElementById(
        "opacity-slider"
    );

if (opacitySlider) {

    opacitySlider.addEventListener(
        "input",
        function() {

            currentOpacity =
                Number(this.value);

            if (currentOverlay) {

                currentOverlay.setOpacity(
                    currentOpacity
                );

            }

        }
    );

}


/* =========================================================
   BASEMAP
========================================================= */

document
    .querySelectorAll(
        'input[name="basemap"]'
    )
    .forEach(function(radio) {

        radio.addEventListener(
            "change",
            function() {

                if (
                    this.value === "osm"
                ) {

                    if (
                        leafletMap.hasLayer(
                            satelliteLayer
                        )
                    ) {

                        leafletMap.removeLayer(
                            satelliteLayer
                        );

                    }

                    osmLayer.addTo(
                        leafletMap
                    );

                }


                if (
                    this.value === "satellite"
                ) {

                    if (
                        leafletMap.hasLayer(
                            osmLayer
                        )
                    ) {

                        leafletMap.removeLayer(
                            osmLayer
                        );

                    }

                    satelliteLayer.addTo(
                        leafletMap
                    );

                }

            }
        );

    });


/* =========================================================
   CORAL TOGGLE
========================================================= */

const coralToggle =
    document.getElementById(
        "coral-toggle"
    );

if (coralToggle) {

    coralToggle.addEventListener(
        "change",
        function() {

            if (!currentOverlay) return;


            if (this.checked) {

                currentOverlay.addTo(
                    leafletMap
                );

            } else {

                leafletMap.removeLayer(
                    currentOverlay
                );

            }

        }
    );

}


/* =========================================================
   SEAGRASS
========================================================= */

const seagrassToggle =
    document.getElementById(
        "seagrass-toggle"
    );

if (seagrassToggle) {

    seagrassToggle.addEventListener(
        "change",
        function() {

            if (this.checked) {

                alert(
                    "Seagrass spatial data is not available in the current dataset."
                );

                this.checked = false;

            }

        }
    );

}


/* =========================================================
   OCEAN CURRENT
========================================================= */

const currentToggle =
    document.getElementById(
        "current-toggle"
    );

if (currentToggle) {

    currentToggle.addEventListener(
        "change",
        function() {

            if (this.checked) {

                alert(
                    "Ocean current spatial data is not available in the current dataset."
                );

                this.checked = false;

            }

        }
    );

}


/* =========================================================
   INITIALIZE WHEN WEBGIS VISIBLE
========================================================= */

const mapSection =
    document.getElementById(
        "webgis"
    );

if (mapSection) {

    const observer =
        new IntersectionObserver(
            function(entries) {

                if (
                    entries[0].isIntersecting &&
                    !mapInitialized
                ) {

                    initMap();

                    observer.disconnect();

                }

            },
            {
                rootMargin:
                    "300px"
            }
        );


    observer.observe(
        mapSection
    );

}


/* =========================================================
   RESIZE
========================================================= */

window.addEventListener(
    "resize",
    function() {

        if (leafletMap) {

            leafletMap.invalidateSize();

        }

    }
);

</script>
