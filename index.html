<script>
document.addEventListener("DOMContentLoaded", function () {

    const rasterData = {
        2021: "./ClippedRajuni2021.tif",
        2024: "./2024new.tif",
        2027: "./2027new.tif",
        2030: "./2030new.tif"
    };

    const sourceData = {
        2021: "Allen Coral Atlas",
        2024: "Allen Coral Atlas",
        2027: "ANN Prediction",
        2030: "ANN Prediction"
    };

    let leafletMap = null;
    let currentOverlay = null;
    let currentYear = 2021;
    let currentOpacity = 0.75;
    let osmLayer = null;
    let satelliteLayer = null;

    /* =========================
       INITIALIZE MAP
    ========================= */

    function initMap() {

        const container = document.getElementById("interactive-map");

        if (!container) {
            console.error("interactive-map tidak ditemukan");
            return;
        }

        console.log("Initializing Leaflet map...");

        leafletMap = L.map("interactive-map", {
            center: [-6.49, 121.06],
            zoom: 12
        });

        /* OpenStreetMap */

        osmLayer = L.tileLayer(
            "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",
            {
                maxZoom: 19,
                attribution: "&copy; OpenStreetMap contributors"
            }
        );

        /* Satellite */

        satelliteLayer = L.tileLayer(
            "https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}",
            {
                maxZoom: 19,
                attribution: "Tiles &copy; Esri"
            }
        );

        osmLayer.addTo(leafletMap);

        setTimeout(function () {
            leafletMap.invalidateSize();
        }, 500);

        loadYear(2021);
    }


    /* =========================
       LOAD GEOTIFF
    ========================= */

    async function loadYear(year) {

        const loading = document.getElementById("map-loading");

        if (loading) {
            loading.classList.remove("hidden");
        }

        try {

            const url = rasterData[year];

            console.log("--------------------------------");
            console.log("Loading GeoTIFF:", url);

            /* Remove previous raster */

            if (currentOverlay) {

                leafletMap.removeLayer(currentOverlay);

                currentOverlay = null;
            }

            /* Fetch GeoTIFF */

            const response = await fetch(
                url + "?v=" + Date.now()
            );

            console.log("HTTP status:", response.status);

            if (!response.ok) {

                throw new Error(
                    "GeoTIFF tidak ditemukan: " +
                    url +
                    " | HTTP " +
                    response.status
                );
            }

            const buffer = await response.arrayBuffer();

            console.log(
                "File size:",
                (buffer.byteLength / 1024 / 1024).toFixed(2),
                "MB"
            );

            /* Parse GeoTIFF */

            console.log("Parsing GeoTIFF...");

            const georaster = await parseGeoraster(buffer);

            console.log("========== GEORASTER ==========");
            console.log("Projection:", georaster.projection);
            console.log("Width:", georaster.width);
            console.log("Height:", georaster.height);
            console.log(
                "Bands:",
                georaster.numberOfRasters
            );
            console.log(
                "NoData:",
                georaster.noDataValue
            );
            console.log("xmin:", georaster.xmin);
            console.log("ymin:", georaster.ymin);
            console.log("xmax:", georaster.xmax);
            console.log("ymax:", georaster.ymax);
            console.log("================================");


            /* =========================
               GEORASTER LAYER
            ========================= */

            const layer = new GeoRasterLayer({

                georaster: georaster,

                opacity: currentOpacity,

                resolution: 128,

                pixelValuesToColorFn: function (values) {

                    if (
                        !values ||
                        values.length === 0
                    ) {
                        return null;
                    }

                    /* RGB GeoTIFF */

                    if (values.length >= 3) {

                        const r = Number(values[0]);
                        const g = Number(values[1]);
                        const b = Number(values[2]);

                        if (
                            !Number.isFinite(r) ||
                            !Number.isFinite(g) ||
                            !Number.isFinite(b)
                        ) {
                            return null;
                        }

                        /* Transparent black */

                        if (
                            r === 0 &&
                            g === 0 &&
                            b === 0
                        ) {
                            return null;
                        }

                        return (
                            "rgb(" +
                            Math.round(r) +
                            "," +
                            Math.round(g) +
                            "," +
                            Math.round(b) +
                            ")"
                        );
                    }

                    /* Single band */

                    const value = Number(values[0]);

                    if (!Number.isFinite(value)) {
                        return null;
                    }

                    if (
                        georaster.noDataValue !== null &&
                        georaster.noDataValue !== undefined &&
                        value === georaster.noDataValue
                    ) {
                        return null;
                    }

                    if (value === 0) {
                        return null;
                    }

                    return "#0f766e";
                }
            });


            /* Add raster */

            layer.addTo(leafletMap);

            currentOverlay = layer;

            console.log("GeoRasterLayer berhasil dibuat.");


            /* =========================
               FIT MAP TO RASTER
            ========================= */

            setTimeout(function () {

                const bounds = layer.getBounds();

                console.log(
                    "Leaflet bounds:",
                    bounds
                );

                if (
                    bounds &&
                    bounds.isValid()
                ) {

                    leafletMap.fitBounds(
                        bounds,
                        {
                            padding: [20, 20],
                            maxZoom: 17
                        }
                    );

                    console.log(
                        "Map berhasil diarahkan ke GeoTIFF."
                    );

                } else {

                    console.error(
                        "GeoTIFF bounds tidak valid."
                    );
                }

            }, 700);


            /* =========================
               UPDATE INFORMATION
            ========================= */

            const yearElement =
                document.getElementById("map-year");

            if (yearElement) {
                yearElement.textContent = year;
            }

            const sourceElement =
                document.getElementById("map-source");

            if (sourceElement) {
                sourceElement.textContent =
                    sourceData[year];
            }

            currentYear = year;

            console.log(
                "GeoTIFF " +
                year +
                " berhasil ditampilkan."
            );

        } catch (error) {

            console.error(
                "GEOTIFF ERROR:",
                error
            );

            currentOverlay = null;

            const errorElement =
                document.getElementById("map-error");

            if (errorElement) {

                errorElement.textContent =
                    "GeoTIFF " +
                    year +
                    " gagal dimuat: " +
                    error.message;

                errorElement.classList.remove(
                    "hidden"
                );

            } else {

                alert(
                    "GeoTIFF " +
                    year +
                    " gagal dimuat.\n\n" +
                    error.message +
                    "\n\nCek Console (F12)."
                );
            }

        } finally {

            if (loading) {
                loading.classList.add("hidden");
            }
        }
    }


    /* =========================
       YEAR BUTTON
    ========================= */

    document
        .querySelectorAll(".year-btn")
        .forEach(function (button) {

            button.addEventListener(
                "click",
                function () {

                    const year =
                        Number(
                            this.dataset.year
                        );

                    document
                        .querySelectorAll(".year-btn")
                        .forEach(
                            function (btn) {
                                btn.classList.remove(
                                    "active"
                                );
                            }
                        );

                    this.classList.add("active");

                    loadYear(year);
                }
            );
        });


    /* =========================
       OPACITY
    ========================= */

    const opacitySlider =
        document.getElementById(
            "opacity-slider"
        );

    if (opacitySlider) {

        opacitySlider.addEventListener(
            "input",
            function () {

                currentOpacity =
                    Number(this.value);

                if (currentOverlay) {

                    currentOverlay.setOpacity(
                        currentOpacity
                    );
                }
            }
        );
    }


    /* =========================
       BASEMAP
    ========================= */

    document
        .querySelectorAll(
            'input[name="basemap"]'
        )
        .forEach(function (radio) {

            radio.addEventListener(
                "change",
                function () {

                    if (
                        this.value === "osm"
                    ) {

                        if (
                            leafletMap.hasLayer(
                                satelliteLayer
                            )
                        ) {

                            leafletMap.removeLayer(
                                satelliteLayer
                            );
                        }

                        osmLayer.addTo(
                            leafletMap
                        );
                    }


                    if (
                        this.value ===
                        "satellite"
                    ) {

                        if (
                            leafletMap.hasLayer(
                                osmLayer
                            )
                        ) {

                            leafletMap.removeLayer(
                                osmLayer
                            );
                        }

                        satelliteLayer.addTo(
                            leafletMap
                        );
                    }
                }
            );
        });


    /* =========================
       CORAL TOGGLE
    ========================= */

    const coralToggle =
        document.getElementById(
            "coral-toggle"
        );

    if (coralToggle) {

        coralToggle.addEventListener(
            "change",
            function () {

                if (!currentOverlay) {
                    return;
                }

                if (this.checked) {

                    currentOverlay.addTo(
                        leafletMap
                    );

                } else {

                    leafletMap.removeLayer(
                        currentOverlay
                    );
                }
            }
        );
    }


    /* =========================
       SEAGRASS
    ========================= */

    const seagrassToggle =
        document.getElementById(
            "seagrass-toggle"
        );

    if (seagrassToggle) {

        seagrassToggle.addEventListener(
            "change",
            function () {

                if (this.checked) {

                    alert(
                        "Seagrass spatial data is not available in the current dataset."
                    );

                    this.checked = false;
                }
            }
        );
    }


    /* =========================
       OCEAN CURRENT
    ========================= */

    const currentToggle =
        document.getElementById(
            "current-toggle"
        );

    if (currentToggle) {

        currentToggle.addEventListener(
            "change",
            function () {

                if (this.checked) {

                    alert(
                        "Ocean current spatial data is not available in the current dataset."
                    );

                    this.checked = false;
                }
            }
        );
    }


    /* =========================
       START MAP
    ========================= */

    initMap();


    /* =========================
       WINDOW RESIZE
    ========================= */

    window.addEventListener(
        "resize",
        function () {

            if (leafletMap) {

                leafletMap.invalidateSize();
            }
        }
    );

});
</script>
