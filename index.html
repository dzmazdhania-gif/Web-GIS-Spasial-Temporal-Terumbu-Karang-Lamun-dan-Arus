<!-- =========================
     LEAFLET + GEOTIFF LIBRARIES
========================= -->

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script src="https://unpkg.com/georaster"></script>

<script src="https://unpkg.com/georaster-layer-for-leaflet/dist/georaster-layer-for-leaflet.min.js"></script>


<script>

    /* =========================================================
       GEOTIFF DATA
    ========================================================= */

    const rasterData = {

        2021: "./ClippedRajuni2021.tif",

        2024: "./2024new.tif",

        2027: "./2027new.tif",

        2030: "./2030new.tif"

    };


    const sourceData = {

        2021: "Allen Coral Atlas",

        2024: "Allen Coral Atlas",

        2027: "ANN Prediction",

        2030: "ANN Prediction"

    };


    /* =========================================================
       GLOBAL VARIABLES
    ========================================================= */

    let leafletMap = null;

    let currentOverlay = null;

    let currentYear = 2021;

    let currentOpacity = 0.75;

    let osmLayer = null;

    let satelliteLayer = null;

    let mapInitialized = false;


    /* =========================================================
       INITIALIZE MAP
    ========================================================= */

    function initMap() {

        if (mapInitialized) {

            return;

        }


        mapInitialized = true;


        /* -----------------------------------------------------
           CREATE MAP
        ----------------------------------------------------- */

        leafletMap = L.map(
            "interactive-map",
            {

                zoomControl: true,

                preferCanvas: true,

                zoomAnimation: false,

                fadeAnimation: false,

                markerZoomAnimation: false,

                inertia: true,

                worldCopyJump: false

            }
        );


        /* -----------------------------------------------------
           OPENSTREETMAP
        ----------------------------------------------------- */

        osmLayer = L.tileLayer(

            "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",

            {

                maxZoom: 18,

                updateWhenIdle: true,

                updateWhenZooming: false,

                keepBuffer: 1,

                attribution:
                    "&copy; OpenStreetMap contributors"

            }

        );


        /* -----------------------------------------------------
           ESRI SATELLITE
        ----------------------------------------------------- */

        satelliteLayer = L.tileLayer(

            "https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}",

            {

                maxZoom: 18,

                updateWhenIdle: true,

                updateWhenZooming: false,

                keepBuffer: 1,

                attribution:
                    "Tiles &copy; Esri"

            }

        );


        /* -----------------------------------------------------
           DEFAULT BASEMAP
        ----------------------------------------------------- */

        osmLayer.addTo(
            leafletMap
        );


        /* -----------------------------------------------------
           LOAD 2021 AUTOMATICALLY
        ----------------------------------------------------- */

        loadYear(
            currentYear
        );


        /* -----------------------------------------------------
           FIX MAP SIZE
        ----------------------------------------------------- */

        setTimeout(
            function() {

                leafletMap.invalidateSize();

            },
            300
        );

    }


    /* =========================================================
       LOAD GEOTIFF
    ========================================================= */

    async function loadYear(year) {

        currentYear = year;


        /* -----------------------------------------------------
           REMOVE PREVIOUS RASTER
        ----------------------------------------------------- */

        if (
            currentOverlay
        ) {

            leafletMap.removeLayer(
                currentOverlay
            );

            currentOverlay = null;

        }


        /* -----------------------------------------------------
           SHOW LOADING
        ----------------------------------------------------- */

        const loading =
            document.getElementById(
                "map-loading"
            );


        loading.classList.remove(
            "hidden"
        );


        try {

            console.log(
                "Loading GeoTIFF:",
                rasterData[year]
            );


            /* -------------------------------------------------
               FETCH TIFF
            ------------------------------------------------- */

            const response =
                await fetch(
                    rasterData[year]
                );


            if (
                !response.ok
            ) {

                throw new Error(
                    "HTTP " +
                    response.status +
                    " - " +
                    rasterData[year]
                );

            }


            /* -------------------------------------------------
               ARRAY BUFFER
            ------------------------------------------------- */

            const arrayBuffer =
                await response.arrayBuffer();


            /* -------------------------------------------------
               PARSE GEOTIFF
            ------------------------------------------------- */

            const georaster =
                await parseGeoraster(
                    arrayBuffer
                );


            console.log(
                "GeoRaster loaded:",
                georaster
            );


            console.log(
                "CRS:",
                georaster.projection
            );


            console.log(
                "Bounds:",
                georaster.xmin,
                georaster.ymin,
                georaster.xmax,
                georaster.ymax
            );


            /* -------------------------------------------------
               CREATE GEORASTER LAYER
            ------------------------------------------------- */

            currentOverlay =
                new GeoRasterLayer({

                    georaster:
                        georaster,

                    opacity:
                        currentOpacity,

                    resolution:
                        256,

                    pixelValuesToColorFn:
                        pixelValuesToColor

                });


            /* -------------------------------------------------
               ADD TO MAP
            ------------------------------------------------- */

            currentOverlay.addTo(
                leafletMap
            );


            /* -------------------------------------------------
               WAIT FOR LAYER
            ------------------------------------------------- */

            currentOverlay.once(
                "load",
                function() {

                    leafletMap.fitBounds(
                        currentOverlay.getBounds(),
                        {
                            padding:
                                [20, 20]
                        }
                    );

                }
            );


            /* -------------------------------------------------
               FALLBACK FIT BOUNDS
            ------------------------------------------------- */

            setTimeout(
                function() {

                    if (
                        currentOverlay
                    ) {

                        const bounds =
                            currentOverlay.getBounds();


                        if (
                            bounds &&
                            bounds.isValid()
                        ) {

                            leafletMap.fitBounds(
                                bounds,
                                {
                                    padding:
                                        [20, 20]
                                }
                            );

                        }

                    }

                },
                500
            );


            /* -------------------------------------------------
               UPDATE MAP INFORMATION
            ------------------------------------------------- */

            document
                .getElementById(
                    "map-year"
                )
                .textContent =
                    year;


            document
                .getElementById(
                    "map-source"
                )
                .textContent =
                    sourceData[year];


            console.log(
                "GeoTIFF successfully displayed:",
                year
            );

        }


        catch (error) {

            console.error(
                "GeoTIFF ERROR:",
                error
            );


            alert(
                "GeoTIFF " +
                year +
                " gagal dimuat. " +
                "Buka Console (F12) untuk melihat detail error."
            );

        }


        finally {

            loading.classList.add(
                "hidden"
            );

        }

    }


    /* =========================================================
       RASTER COLOR FUNCTION
    ========================================================= */

    function pixelValuesToColor(
        values
    ) {

        /*
           No pixel
        */

        if (
            !values ||
            values.length === 0
        ) {

            return null;

        }


        /*
           -----------------------------------------
           RGB / RGBA RASTER
           -----------------------------------------
        */

        if (
            values.length >= 3
        ) {

            const r =
                Number(values[0]);

            const g =
                Number(values[1]);

            const b =
                Number(values[2]);


            /*
               Transparent empty pixel
            */

            if (
                !Number.isFinite(r) ||
                !Number.isFinite(g) ||
                !Number.isFinite(b)
            ) {

                return null;

            }


            /*
               Black background
            */

            if (
                r === 0 &&
                g === 0 &&
                b === 0
            ) {

                return null;

            }


            return (
                "rgba(" +
                r +
                "," +
                g +
                "," +
                b +
                ",1)"
            );

        }


        /*
           -----------------------------------------
           SINGLE BAND RASTER
           -----------------------------------------
        */

        const value =
            Number(values[0]);


        /*
           Empty / NoData
        */

        if (
            !Number.isFinite(value)
        ) {

            return null;

        }


        /*
           Background 0
        */

        if (
            value === 0
        ) {

            return null;

        }


        /*
           Coral class
        */

        return "#0f766e";

    }


    /* =========================================================
       YEAR BUTTONS
    ========================================================= */

    document
        .querySelectorAll(
            ".year-btn"
        )
        .forEach(
            button => {

                button.addEventListener(
                    "click",
                    function() {

                        const year =
                            Number(
                                this.dataset.year
                            );


                        /*
                           Active button
                        */

                        document
                            .querySelectorAll(
                                ".year-btn"
                            )
                            .forEach(
                                btn => {

                                    btn.classList.remove(
                                        "active"
                                    );

                                }
                            );


                        this.classList.add(
                            "active"
                        );


                        /*
                           Load raster
                        */

                        if (
                            mapInitialized
                        ) {

                            loadYear(
                                year
                            );

                        }

                    }
                );

            }
        );


    /* =========================================================
       OPACITY
    ========================================================= */

    document
        .getElementById(
            "opacity-slider"
        )
        .addEventListener(
            "input",
            function() {

                currentOpacity =
                    Number(
                        this.value
                    );


                if (
                    currentOverlay
                ) {

                    currentOverlay.setOpacity(
                        currentOpacity
                    );

                }

            }
        );


    /* =========================================================
       BASEMAP
    ========================================================= */

    document
        .querySelectorAll(
            'input[name="basemap"]'
        )
        .forEach(
            radio => {

                radio.addEventListener(
                    "change",
                    function() {

                        if (
                            !mapInitialized
                        ) {

                            return;

                        }


                        /* ---------------------------------
                           OSM
                        --------------------------------- */

                        if (
                            this.value === "osm"
                        ) {

                            if (
                                leafletMap.hasLayer(
                                    satelliteLayer
                                )
                            ) {

                                leafletMap.removeLayer(
                                    satelliteLayer
                                );

                            }


                            if (
                                !leafletMap.hasLayer(
                                    osmLayer
                                )
                            ) {

                                osmLayer.addTo(
                                    leafletMap
                                );

                            }

                        }


                        /* ---------------------------------
                           SATELLITE
                        --------------------------------- */

                        if (
                            this.value === "satellite"
                        ) {

                            if (
                                leafletMap.hasLayer(
                                    osmLayer
                                )
                            ) {

                                leafletMap.removeLayer(
                                    osmLayer
                                );

                            }


                            if (
                                !leafletMap.hasLayer(
                                    satelliteLayer
                                )
                            ) {

                                satelliteLayer.addTo(
                                    leafletMap
                                );

                            }

                        }

                    }
                );

            }
        );


    /* =========================================================
       CORAL TOGGLE
    ========================================================= */

    document
        .getElementById(
            "coral-toggle"
        )
        .addEventListener(
            "change",
            function() {

                if (
                    !currentOverlay
                ) {

                    return;

                }


                if (
                    this.checked
                ) {

                    currentOverlay.addTo(
                        leafletMap
                    );

                }

                else {

                    leafletMap.removeLayer(
                        currentOverlay
                    );

                }

            }
        );


    /* =========================================================
       SEAGRASS PLACEHOLDER
    ========================================================= */

    document
        .getElementById(
            "seagrass-toggle"
        )
        .addEventListener(
            "change",
            function() {

                if (
                    this.checked
                ) {

                    alert(
                        "Seagrass spatial data is not available in the current dataset."
                    );


                    this.checked =
                        false;

                }

            }
        );


    /* =========================================================
       CURRENT PLACEHOLDER
    ========================================================= */

    document
        .getElementById(
            "current-toggle"
        )
        .addEventListener(
            "change",
            function() {

                if (
                    this.checked
                ) {

                    alert(
                        "Ocean current spatial data is not available in the current dataset."
                    );


                    this.checked =
                        false;

                }

            }
        );


    /* =========================================================
       LAZY LOAD
    ========================================================= */

    const mapSection =
        document.getElementById(
            "webgis"
        );


    const mapObserver =
        new IntersectionObserver(

            function(entries) {

                if (
                    entries[0].isIntersecting &&
                    !mapInitialized
                ) {

                    initMap();


                    mapObserver.disconnect();

                }

            },

            {

                rootMargin:
                    "400px 0px"

            }

        );


    mapObserver.observe(
        mapSection
    );


    /* =========================================================
       WINDOW RESIZE
    ========================================================= */

    window.addEventListener(
        "resize",
        function() {

            if (
                leafletMap
            ) {

                requestAnimationFrame(
                    () => {

                        leafletMap.invalidateSize();

                    }
                );

            }

        }
    );

</script>
